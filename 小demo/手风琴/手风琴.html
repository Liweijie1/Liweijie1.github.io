<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title></title>
	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
		}

		.bg {
			width: 100vw;
			height: 100vw;
			position: fixed;
			top: 0;
			left: 0;
			z-index: -1;
			background-image: url(./img/红海湾.png);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			opacity: 0.5;
		}

		ul li {
			list-style: none;
		}

		#main {
			width: 100%;
			height: 260px;
			margin: 100px auto 0;
			display: flex;
			justify-content: center;
		}

		.top {
			width: 100%;
		}

		#main ul li {
			width: 200px;
			height: 260px;
			float: left;
			position: relative;
		}

		#main ul li div {
			width: 100%;
			height: 260px;
		}

		#main ul li div.des {
			position: absolute;
			left: 0;
			top: 0;
			background: rgba(0, 0, 0, .3);

		}

		#main ul li div.des h4 {
			color: #FFF;
			font-size: 30px;
			padding: 30px;
			width: 30px;
			margin: 0 auto;
		}

		#main ul li:nth-child(1) div.pic {
			background-image:  url(img/红海湾.png);
			background-position: center;
			background-size: auto 100%;
		}
		#main ul li:nth-child(2) div.pic {
			background-image: url(img/黄山.png);
			background-position: center;
			background-size: auto 100%;
		}
		#main ul li:nth-child(3) div.pic {
			background-image:  url(img/升钟湖.png);
			background-position: center;
			background-size: auto 100%;
		}
		#main ul li:nth-child(4) div.pic {
			background-image: url(img/西湖.png);
			background-position: center;
			background-size: auto 100%;
		}
	</style>

</head>

<body>
	<div class="bg"></div>
	<div id="main">
		<ul>
			<li>
				<div class="des">
					<h4>红海湾</h4>
				</div>
				<div class="pic"></div>
			</li>
			<li>
				<div class="des">
					<h4>黄山</h4>
				</div>
				<div class="pic"></div>
			</li>
			<li>
				<div class="des">
					<h4>升钟湖</h4>
				</div>
				<div class="pic"></div>
			</li>
			<li>
				<div class="des">
					<h4>西湖</h4>
				</div>
				<div class="pic"></div>
			</li>

		</ul>
	</div>
	<script src="./jQuery.min.js"></script>
	<script>
		$('ul li').mouseover(function () {
			// 所有动画停止
			$('ul li').stop()
			// 兄弟节点恢复原来的样式
			$(this).siblings().animate({
				width: '160px'
			}, 30).find('div.des').show()
			// 调整自身样式
			$(this).animate({
				width: '400px'
			}, 500).find('div.des').hide()
			$(".bg").css('background-image',$(this).children("div:nth-child(2)").css('background-image'))
		})
	</script>
</body>

</html>
