<!DOCTYPE html>
<html lang="CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

     

    select {
      font-size: 20px;
      font-weight: 600;
    }

    .small,
    .big {
      width: 400px;
      height: 400px;
      margin: 10px;
      overflow: hidden;
      float: left;
      position: relative;
    }

    .small img,
    .big img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .mask {
      width: 200px;
      height: 200px;
      background-color: rgba(255, 255, 0, 0.3);
      /* 设置光标为放大镜 */
      cursor: zoom-in;
      position: absolute;
      top: 0;
      left: 0;
    }

    ul {
      width: 400px;
      height: 100px;
      clear: both;
      display: flex;
      justify-content: space-around;
      align-items: center;
      list-style: none;
    }

    li {
      width: 60px;
      height: 60px;
      cursor: pointer;
    }

    li img {
      width: 60px;
      height: 60px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>图片放大倍数
      <select id="select">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </h3>
    <div class="small">
      <img class="small-img" src="./img/banner1.jpg" alt="">
      <div class="mask"></div>
    </div>
    <div class="big">
      <img class="big-img" src="./img/banner1.jpg" alt="">
    </div>
    <ul class="bottom">
      <li><img src="./img/banner1.jpg" alt=""></li>
      <li><img src="./img/banner2.jpg" alt=""></li>
      <li><img src="./img/banner3.jpg" alt=""></li>
      <li><img src="./img/banner4.jpg" alt=""></li>
      <li><img src="./img/banner5.jpg" alt=""></li>
    </ul>
  </div>

  <script>
    var select = document.getElementById("select")
    var small = document.getElementsByClassName("small")[0]
    var smallImg = document.getElementsByClassName("small-img")[0]
    var big = document.getElementsByClassName("big")[0]
    var bigImg = document.getElementsByClassName("big-img")[0]
    var mask = document.getElementsByClassName("mask")[0]
    var imgs = document.getElementsByTagName("img")

    // 声明要放大的倍数
    var multiple = select.value

    // 设置默认放大后的图片宽高
    bigImg.style.width = small.offsetWidth * multiple + 'px'
    bigImg.style.height = small.offsetHeight * multiple + 'px'

    // 设置图片放大后.mask 元素的宽高
    mask.style.width = small.offsetWidth / multiple + 'px'
    mask.style.height = small.offsetHeight / multiple + 'px'

    // 点击底部图片，切换上面的图片
    for (let i = 0; i < 6; i++) {
      imgs[i + 1].onclick = function () {
        smallImg.src = imgs[i + 1].src
        bigImg.src = imgs[i + 1].src
      }
    }

    // 选项框的值改变时,重新改变要放大的倍数
    select.onchange = function () {
      // 获取要放大的倍数
      multiple = select.value

      // 设置图片放大后的宽高
      bigImg.style.width = small.offsetWidth * multiple + 'px'
      bigImg.style.height = small.offsetHeight * multiple + 'px'

      // 设置图片放大后.mask 元素的宽高
      mask.style.width = small.offsetWidth / multiple + 'px'
      mask.style.height = small.offsetHeight / multiple + 'px'
    }

    // 当鼠标在.small盒子里移动时,改变.mask的位置
    small.onmousemove = function (e) {
      // e.clientX 是鼠标指针当前位置相对于浏览器窗口（视口）左边的距离。
      // small.offsetLeft从屏幕的左边到.small元素左边的距离。
      // 减去50是为了将.mask元素的中心与鼠标指针的位置对齐
      var maskX = e.clientX - small.offsetLeft - 50
      var maskY = e.clientY - small.offsetTop - 50
      console.dir(mask);

      // 防止.mask 元素超出.small的边界
      if (maskX <= 0) {
        maskX = 0
      }
      if (maskX >= small.offsetWidth - mask.offsetWidth) {
        maskX = small.offsetWidth - mask.offsetWidth
      }
      if (maskY <= 0) {
        maskY = 0
      }
      if (maskY >= small.offsetHeight - mask.offsetHeight) {
        maskY = small.offsetHeight - mask.offsetHeight
      }

      // 设置.mask 元素的位移,使 .mask 元素能够以鼠标指针为中心点，跟随鼠标在 .small 元素内部移动
      mask.style.left = maskX + 'px'
      mask.style.top = maskY + 'px'

      // 当.mask 元素移动时,放大的图片应该反方向移动相应的倍数
      bigImg.style.left = -maskX * multiple + 'px'
      bigImg.style.top = -maskY * multiple + 'px'

    }

  </script>
</body>

</html>
